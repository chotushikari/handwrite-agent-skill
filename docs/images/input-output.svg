    <rect width="250" height="46" rx="10" fill="#e8e4ff"/>
    <circle cx="23" cy="23" r="6" fill="#6554c0"/>
    <circle cx="45" cy="23" r="6" fill="#6554c0" opacity=".55"/>
    <circle cx="67" cy="23" r="6" fill="#6554c0" opacity=".3"/>
