<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">What you provide and what you get</title>
  <desc id="desc">An assignment and handwriting reference on the left flow into a handwritten notebook page on the right.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#27324a" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#background)"/>
  <text x="72" y="54" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#27324a">WHAT YOU PROVIDE</text>
  <text x="858" y="54" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#27324a">WHAT YOU GET</text>
  <g filter="url(#shadow)" transform="translate(78 85) rotate(-5 140 130)">
