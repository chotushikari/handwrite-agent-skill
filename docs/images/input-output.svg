    <path d="M25 112h196M25 142h170M25 172h190M25 202h150" stroke="#a9b5ca" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 236h84" stroke="#6554c0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)" transform="translate(350 115) rotate(7 80 105)">
