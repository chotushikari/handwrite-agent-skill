<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Handwrite workflow</title>
  <desc id="desc">Five connected steps: audit, plan, compose, render, and inspect.</desc>
  <rect width="1200" height="260" rx="24" fill="#fbfbfe"/>
  <path d="M130 130h940" stroke="#d9d4f7" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 48)">
      <circle cx="60" cy="64" r="49" fill="#6554c0"/>
      <path d="M40 45h40v40H40zM47 58h26M47 68h20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="60" y="151" font-size="17" font-weight="700" fill="#27324a">AUDIT</text>
      <text x="60" y="175" font-size="13" fill="#667085">read everything</text>
    </g>
    <g transform="translate(290 48)">
      <circle cx="60" cy="64" r="49" fill="#3678ba"/>
      <path d="M42 47h36v34H42zM49 58h22M49 67h15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="60" y="151" font-size="17" font-weight="700" fill="#27324a">PLAN</text>
      <text x="60" y="175" font-size="13" fill="#667085">split pages</text>
    </g>
    <g transform="translate(510 48)">
      <circle cx="60" cy="64" r="49" fill="#2a9d8f"/>
      <path d="m43 77 30-30M42 83h38M48 50l10 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="60" y="151" font-size="17" font-weight="700" fill="#27324a">COMPOSE</text>
      <text x="60" y="175" font-size="13" fill="#667085">write exact content</text>
    </g>
    <g transform="translate(730 48)">
      <circle cx="60" cy="64" r="49" fill="#e78b4b"/>
      <path d="M42 48h36v34H42zM49 59h22M49 69h14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="60" y="151" font-size="17" font-weight="700" fill="#27324a">RENDER</text>
      <text x="60" y="175" font-size="13" fill="#667085">one page at a time</text>
    </g>
    <g transform="translate(950 48)">
      <circle cx="60" cy="64" r="49" fill="#d35d78"/>
      <path d="m42 65 13 13 25-29" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="151" font-size="17" font-weight="700" fill="#27324a">INSPECT</text>
      <text x="60" y="175" font-size="13" fill="#667085">verify coverage</text>
    </g>
  </g>
</svg>
