<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Handwrite: from source material to notebook pages</title>
  <desc id="desc">A notebook page, a planning card, and a rendered handwritten page connected in a warm editorial illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#27324a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="58" r="95" fill="#e1dcff" opacity=".65"/>
  <circle cx="92" cy="280" r="100" fill="#d9f4ed" opacity=".8"/>
  <path d="M75 106 C150 45 235 58 292 112" fill="none" stroke="#7b67ee" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/>
  <g filter="url(#shadow)" transform="translate(95 61) rotate(-7 120 115)">
