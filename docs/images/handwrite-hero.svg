    <path d="M32 48h156M32 76h156M32 104h156M32 132h156M32 160h110M32 188h142" stroke="#b8d4ed" stroke-width="3"/>
    <path d="M39 37c37-20 72 8 103-8M40 95c35-13 68 13 113-7M41 151c36-16 58 11 101-3" fill="none" stroke="#3678ba" stroke-width="4" stroke-linecap="round"/>
