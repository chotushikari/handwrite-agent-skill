    <circle cx="27" cy="23" r="6" fill="#fff" opacity=".8"/>
    <circle cx="49" cy="23" r="6" fill="#fff" opacity=".55"/>
    <circle cx="71" cy="23" r="6" fill="#fff" opacity=".35"/>
    <text x="24" y="82" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#27324a">PAGE PLAN</text>
    <text x="24" y="112" font-family="Arial,sans-serif" font-size="14" fill="#536078">01  Audit the source</text>
    <text x="24" y="138" font-family="Arial,sans-serif" font-size="14" fill="#536078">02  Split readable pages</text>
    <text x="24" y="164" font-family="Arial,sans-serif" font-size="14" fill="#536078">03  Check every equation</text>
